name: Build, Lint Dockerfile, Push Docker Image and Apply Terraform

on:
  push:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.time.outputs.time }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Time
        id: time
        run: echo "time=$(TZ=Europe/Paris date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      # TODO: Valider app/Dockerfile avec hadolint (le pipeline doit échouer dès le niveau warning)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        env:
          IMAGE_NAME: "${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/flask-minesweeper"
        run: |
          docker build  --build-arg VERSION=${{ steps.time.outputs.time }} -t $IMAGE_NAME:${{ steps.time.outputs.time }} -f app/Dockerfile ./app
          docker push $IMAGE_NAME:${{ steps.time.outputs.time }}

      - name: Tag image as stable
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: "${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/flask-minesweeper"
        run: |
          docker tag $IMAGE_NAME:${{ steps.time.outputs.time }} $IMAGE_NAME:stable
          docker push $IMAGE_NAME:stable
  
  create-update-infra:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0

      - name: Terraform Init
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: terraform init
        working-directory: infra

      - name: Terraform Plan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: terraform plan -var-file="env.tfvars" -var="image_tag=${{ needs.build.outputs.image_tag }}"
        working-directory: infra

      - name: Terraform Apply
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: terraform apply -auto-approve -var-file="env.tfvars" -var="image_tag=${{ needs.build.outputs.image_tag }}"
        working-directory: infra
